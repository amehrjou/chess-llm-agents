[project]
name = "cursor-ai-sample"
version = "0.1.0"
description = "A sample project with cursor to test its functionalities and features"
authors = [
    {name = "Arah Mehrjou"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.11.11"
dependencies = [
    "langgraph>=0.0.15",
    "chess>=1.9.4",
    "llama-cpp-python>=0.2.11",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "cairosvg>=2.7.1",
    "Pillow>=10.0.0"
]

[tool.poetry]
packages = [
    { include = "agents" },
    { include = "game" },
    { include = "utils" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api" 